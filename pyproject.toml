[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disklavier-auto"
version = "3.0.0"
description = "Autonomous 4-Act Co-Composition Studio & Physical Safety Engine for Yamaha Disklavier (Windows 11 / RTX 3070)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "mido>=1.3.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "matplotlib>=3.9.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
audio = [
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
  "python-rtmidi>=1.5.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:sounddevice",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data", "obsidian_vault"]

[tool.ruff.lint.per-file-ignores]
"validate_system_integrity.py" = ["E402"]
"scripts/*.py" = ["E402"]
