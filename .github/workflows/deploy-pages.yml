name: Deploy Disklavier-Auto Interactive Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg & lightweight verification dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn websockets pydantic mido numpy scipy pyyaml httpx pytest soundfile

      - name: Run unit & safety test suites
        run: |
          PYTHONPATH=. pytest -v tests/test_safety_guard.py tests/test_phase1_security.py

      - name: Verify 100-piece musicality catalog and 10 showcase MP3/MIDI assets
        run: |
          PYTHONPATH=. python scripts/verify_catalog_and_demo.py

      - name: Verify static web-demo asset structure (relative paths, no broken links)
        run: |
          python -c "
          import json, pathlib
          root = pathlib.Path('web-demo')
          for req in ['index.html', 'app.js', 'style.css', 'favicon.ico', 'data/catalog_100.json']:
              assert (root / req).exists(), f'Missing {req}'
          html = (root / 'index.html').read_text(encoding='utf-8')
          assert './app.js' in html and './style.css' in html and './favicon.ico' in html
          cat = json.loads((root / 'data' / 'catalog_100.json').read_text(encoding='utf-8'))
          assert len(cat['pieces']) == 100
          for e in cat['pieces']:
              assert (root / 'data' / 'pieces' / f\"{e['id']}.json\").exists()
              if e.get('showcase_mp3'):
                  assert (root / e['showcase_mp3']).exists()
              if e.get('showcase_mid'):
                  assert (root / e['showcase_mid']).exists()
          print('Static web-demo bundle integrity verified (100 pieces + 10 MP3/MID assets).')
          "

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
